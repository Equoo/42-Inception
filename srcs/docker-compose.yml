services:
  mariadb:
    build: requirements/mariadb
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - docker-network
    secrets:
      - mysql_password

  nginx:
    build: requirements/nginx
    ports:
      - "4444:443"
    volumes:
      - wordpress:/var/www/html
    networks:
      - docker-network
    secrets:
      - nginx_cert
      - nginx_key
    depends_on:
      - wordpress

  wordpress:
    build: requirements/wordpress
    volumes:
      - wordpress:/var/www/html
    networks:
      - docker-network
    secrets:
      - mysql_password
    depends_on:
      - mariadb

networks:
  docker-network:
    driver: bridge

volumes:
  wordpress:
  mariadb:

secrets:
  mysql_password:
    file: ../secrets/mysql_password
  nginx_cert:
    file: ../secrets/cert.pem
  nginx_key:
    file: ../secrets/key.pem
