services:
  mariadb:
    build: requirements/mariadb
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - docker-network

  nginx:
    build: requirements/nginx
    ports:
      - "443:443"
    volumes:
      - wordpress:/var/lib/nginx/html
    networks:
      - docker-network
    secrets:
      - nginx_cert
      - nginx_key
    depends_on:
      - wordpress

  wordpress:
    build: requirements/wordpress
    volumes:
      - wordpress:/var/www
    networks:
      - docker-network
    depends_on:
      - mariadb

networks:
  docker-network:
    driver: bridge

volumes:
  wordpress:
  mariadb:

secrets:
  nginx_cert:
    file: secrets/cert.pem
  nginx_key:
    file: secrets/key.pem
