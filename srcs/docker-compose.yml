services:
  mariadb:
    build: requirements/mariadb
    ports:
      - "3307:3306"
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - database
    secrets:
      - mysql_password
      - mysql_root_password
    env_file: ".env"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  nginx:
    build: requirements/nginx
    ports:
      - "4444:443"
    volumes:
      - wordpress:/var/www/html
    networks:
      - wordpress
    secrets:
      - nginx_cert
      - nginx_key
    depends_on:
      wordpress:
        condition: service_healthy
    env_file: ".env"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  wordpress:
    build: requirements/wordpress
    volumes:
      - wordpress:/var/www/html/wordpress
    networks:
      - wordpress
      - database
      - redis
    secrets:
      - mysql_password
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    env_file: ".env"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  ftp:
    build: requirements/ftp
    ports:
      - "2021:21"
      - "10000-10100:10000-10100"
    volumes:
      - wordpress:/srv
    networks:
      - ftp
    secrets:
      - ftp_password
    env_file: ".env"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  redis:
    build: requirements/redis
    networks:
      - redis
    env_file: ".env"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

networks:
  database:
    driver: bridge
  wordpress:
    driver: bridge
  ftp:
    driver: bridge
  redis:
    driver: bridge

  docker-network:
    driver: bridge

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dderny/data/wordpress
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dderny/data/mariadb

secrets:
  ftp_password:
    file: ../secrets/ftp_password
  mysql_password:
    file: ../secrets/mysql_password
  mysql_root_password:
    file: ../secrets/mysql_root_password
  nginx_cert:
    file: ../secrets/cert.pem
  nginx_key:
    file: ../secrets/key.pem
