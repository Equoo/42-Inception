services:
  mariadb:
    build: requirements/mariadb
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - docker-network

  nginx:
    build: requirements/nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - wordpress:/var/lib/nginx/html
    networks:
      - docker-network

  wordpress:
    build: requirements/wordpress
    volumes:
      - wordpress:/var/www
    networks:
      - docker-network
    depends_on:
       - mariadb
       - nginx

networks:
  docker-network:
    driver: bridge

volumes:
  wordpress:
  mariadb:
