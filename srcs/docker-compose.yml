services:
  mariadb:
    build: mandatory/mariadb
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - database
    secrets:
      - mysql_password
      - mysql_root_password
    env_file: ".env"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  nginx:
    build: mandatory/nginx
    ports:
      - "4444:443"
    volumes:
      - wordpress:/var/www/wordpress/
    networks:
      - nginx
    secrets:
      - nginx_cert
      - nginx_key
    depends_on:
      wordpress:
        condition: service_healthy
      adminer:
        condition: service_healthy
    env_file: ".env"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  wordpress:
    build: mandatory/wordpress
    volumes:
      - wordpress:/var/www/wordpress/
    networks:
      - nginx
      - database
      - redis
    secrets:
      - mysql_password
      - wp_admin_password
      - wp_user_password
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    env_file: ".env"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  ftp:
    build: bonus/ftp
    ports:
      - "2021:21"
      - "10000-10100:10000-10100"
    volumes:
      - wordpress:/srv
    networks:
      - ftp
    secrets:
      - ftp_password
    env_file: ".env"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  redis:
    build: bonus/redis
    networks:
      - redis
    env_file: ".env"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  grafana:
    build: bonus/grafana
    networks:
      - redis
      - nginx
      - database
    volumes:
      - grafana:/usr/share/grafana
    secrets:
      - mysql_password
      - gf_password
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    env_file: ".env"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  adminer:
    build: bonus/adminer
    networks:
      - nginx
      - database
    env_file: ".env"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

networks:
  database:
    driver: bridge
  nginx:
    driver: bridge
  ftp:
    driver: bridge
  redis:
    driver: bridge

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dderny/data/wordpress
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dderny/data/mariadb
  grafana:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dderny/data/grafana

secrets:
  wp_admin_password:
    file: ../secrets/wp_admin_password
  wp_user_password:
    file: ../secrets/wp_user_password
  ftp_password:
    file: ../secrets/ftp_password
  gf_password:
    file: ../secrets/gf_password
  mysql_password:
    file: ../secrets/mysql_password
  mysql_root_password:
    file: ../secrets/mysql_root_password
  nginx_cert:
    file: ../secrets/cert.pem
  nginx_key:
    file: ../secrets/key.pem
