services:
  mariadb:
    build: requirements/mariadb
    ports:
      - "3307:3306"
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - docker-network
    secrets:
      - mysql_password
      - mysql_root_password
    env_file: ".env"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  nginx:
    build: requirements/nginx
    ports:
      - "4444:443"
    volumes:
      - wordpress:/var/www/html
    networks:
      - docker-network
    secrets:
      - nginx_cert
      - nginx_key
    depends_on:
      - wordpress
    env_file: ".env"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  wordpress:
    build: requirements/wordpress
    volumes:
      - wordpress:/var/www/html
    networks:
      - docker-network
    secrets:
      - mysql_password
    depends_on:
      - mariadb
    env_file: ".env"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

networks:
  docker-network:
    driver: bridge

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dderny/data/wordpress
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dderny/data/mariadb

secrets:
  mysql_password:
    file: ../secrets/mysql_password
  mysql_root_password:
    file: ../secrets/mysql_root_password
  nginx_cert:
    file: ../secrets/cert.pem
  nginx_key:
    file: ../secrets/key.pem
