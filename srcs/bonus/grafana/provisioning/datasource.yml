apiVersion: 1

datasources:
  - name: wordpress
    type: mysql
    access: proxy
    url: mariadb:3306
    database: ${MYSQL_DB}
    user: ${MYSQL_USER}
    secureJsonData:
      password: ${MYSQL_PASSWORD}
    isDefault: true
    editable: false

  - name: redis
    type: redis-datasource
    access: proxy
    url: redis:6379
    jsonData:
      client: standalone
    editable: false
