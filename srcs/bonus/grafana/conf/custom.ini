
[server]
# Protocol (http, https, h2, socket)
protocol = http
domain = ${DOMAIN_NAME}
root_url = https://%(domain)s/grafana/
serve_from_sub_path = true

[database]
type = mysql
host = mariadb:3306
name = grafana_db
user = grafana_user
password = grafana

[session]
provider = mysql
provider_config = grafana_user:grafana@tcp(mariadb:3306)/grafana_db

[security]
admin_user = ${GF_USER}
admin_password = ${GF_PASSWORD}
