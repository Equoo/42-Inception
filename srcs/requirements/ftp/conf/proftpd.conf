ServerName          "ProFTPD Server"
ServerType          standalone
Port                21
SocketBindTight     off

# Bind to all interfaces
DefaultAddress      0.0.0.0

# User/group for daemon
User                proftpd
Group               proftpd

# Use /tmp instead of /run (Docker-safe)
DelayTable          /tmp/proftpd/proftpd.delay
ScoreboardFile      /tmp/proftpd/proftpd.scoreboard
SocketBindTight     off

# Logging
SystemLog           /var/log/proftpd/proftpd.log
TransferLog         /var/log/proftpd/xferlog.legacy

# Allow local users to login
AllowForeignAddress off
AllowStoreRestart   off

# Chroot users to home directory
DefaultRoot         /srv !adm
AllowOverwrite      on

# Passive mode
PassivePorts        10000 10100

# Umask for new files/dirs
Umask               022 022

# Authentication
AuthUserFile        /etc/proftpd/ftpd.passwd
AuthGroupFile       /etc/proftpd/ftpd.group

# Limits
MaxInstances        30
MaxLoginAttempts    3
TimeoutLogin        120
TimeoutIdle         600
TimeoutNoTransfer   900

# Virtual user setup (optional, see below)
# <IfModule mod_auth_file.c>
#   AuthUserFile  /etc/proftpd/ftpd.passwd
#   AuthGroupFile /etc/proftpd/ftpd.group
# </IfModule>

